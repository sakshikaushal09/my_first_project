name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update file
        run: |
          echo "Last update: $(date)" > activity.txt

      - name: Commit and Push
        run: |
          git config user.name "sakshikaushal09"
          git config user.email "2k24.csaiml1c.2412593@gmail.com"
          git add activity.txt
          git commit -m "Daily auto commit" || exit 0
          git push
